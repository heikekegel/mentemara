# PostgreSQL configuration for Active Record.
#
# Development and test use local PostgreSQL databases.
# Production connection details are supplied through environment variables
# so credentials are never committed to Git.
#
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: mentemara_development

test:
  <<: *default
  database: mentemara_test

# Production uses separate PostgreSQL connections for application data,
# caching, background jobs, and Action Cable.
production:
  primary:
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>

  cache:
    <<: *default
    url: <%= ENV["CACHE_DATABASE_URL"] %>
    migrations_paths: db/cache_migrate

  queue:
    <<: *default
    url: <%= ENV["QUEUE_DATABASE_URL"] %>
    migrations_paths: db/queue_migrate

  cable:
    <<: *default
    url: <%= ENV["CABLE_DATABASE_URL"] %>
    migrations_paths: db/cable_migrate
